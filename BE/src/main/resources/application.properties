spring.application.name=u5d8

# Segreti opzionali da file locale non versionato (BE/env.properties); in alternativa variabili d'ambiente
spring.config.import=optional:file:env.properties

# --- Database (Postgres locale) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/u5d8
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Niente sessione Hibernate aperta durante la serializzazione: i DTO vanno costruiti dentro i service
spring.jpa.open-in-view=false

server.port=3001

# --- LLM (OpenRouter, API compatibile OpenAI) ---
app.llm.base-url=https://openrouter.ai/api/v1
# La chiave NON ha default: se manca, l'avvio fallisce subito ("Could not resolve placeholder 'OPENROUTER_API_KEY'")
app.llm.api-key=${OPENROUTER_API_KEY}
# Modelli in ordine di preferenza: se il primo e' saturo (429 del pool gratuito) OpenRouter passa al successivo
app.llm.modelli=nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free
# Strategia di contesto: oltre alle istruzioni, si inviano solo gli ultimi N messaggi della chat
app.llm.max-messaggi-contesto=20
app.llm.timeout-connessione-secondi=5
app.llm.timeout-lettura-secondi=60
